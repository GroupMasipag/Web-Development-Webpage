<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register · Fixed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
        }

        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            position: relative;
            width: 50%;
            background-image: url('WIN_20260915_16_56_29_Pro.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
            color: #fff;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(131, 87, 165, 0.95), rgba(107, 127, 215, 0.4));
            z-index: 1;
        }

        .left-content {
            position: relative;
            z-index: 2;
        }

        .left-content h3 {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .left-content p {
            font-size: 1.1em;
            margin-bottom: 30px;
            color: #f0f0f0;
            line-height: 1.6;
            max-width: 500px;
        }

        .toggle-btn {
            padding: 12px 30px;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 1rem;
        }

        .toggle-btn:hover {
            background: #fff;
            color: #8357a5;
        }

        .right-panel {
            position: relative;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: linear-gradient(135deg, #6b7fd7, #8357a5);
        }
        .text-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: underline;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .text-link:hover {
            color: #e0e0e0;
        }
        .form-box {
            position: absolute;
            width: 60%;
            max-width: 400px;
            transition: 0.4s ease-in-out;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .form-box.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.95);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .logo-placeholder {
            width: 60px;
            height: 60px;
            background: transparent;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-header h2 {
            font-size: 1.8em;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .form-header p {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
            font-size: 1em;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.25);
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: none;
            border-radius: 20px;
            color: #7966b3; 
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #f0f0f0;
            color: #5c4a91;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #ffffff;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .left-panel {
                width: 100%;
                min-height: 280px;
                height: auto;
                padding: 40px 30px;
                justify-content: center;
            }

            .left-content h3 {
                font-size: 2em;
            }

            .left-content p {
                font-size: 1em;
                margin-bottom: 25px;
            }

            .right-panel {
                width: 100%;
                padding: 40px 20px;
                min-height: 60vh;
                align-items: flex-start;
                padding-top: 30px;
            }

            .form-box {
                position: relative;
                width: 100%;
                max-width: 100%;
                margin: 0 auto;
            }

            .form-box.hidden {
                display: none;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            #login-form,
            #register-form {
                position: relative;
            }
        }

        @media (max-width: 480px) {
            .left-panel {
                padding: 30px 20px;
                min-height: 240px;
            }

            .left-content h3 {
                font-size: 1.8em;
            }

            .toggle-btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }

            .form-header h2 {
                font-size: 1.6em;
            }

            .input-group input {
                padding: 12px 16px;
                font-size: 0.95em;
            }

            .action-btn {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="left-panel">
            <div class="left-content" id="left-info">
                <h3>Welcome!</h3>
                <p>Access your portal and manage your account securely with our integrated dashboard system.</p>
                <button class="toggle-btn" onclick="switchForm('register')">Register</button>
            </div>
        </div>

        <div class="right-panel">
            
            <div class="form-box" id="login-form">
                <div class="form-header">
                    <div class="logo-placeholder">
                        <img src="purple star.jpg" alt="Logo" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                    </div>
                    <h2>5 Little Monkeys</h2>
                    <p>Sign in to start your session</p>
                </div>
                <form action="#" onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <input type="text" placeholder="Student ID / Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="action-btn">Sign In</button>
                    <a href="#" class="forgot-link">I forgot my password</a>
                </form>
            </div>

            <div class="form-box hidden" id="register-form">
                <div class="form-header">
                    <div class="logo-placeholder">
                        <img src="purple star.jpg" alt="Logo" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                    </div>
                    <h2>Create Account</h2>
                    <p>Fill in the details to register</p>
                </div>
                <form action="#" onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <input type="text" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                    </div>
                    <a href="#" class="text-link" onclick="switchForm('login')">Already have an account? Sign in!</a>
                    <button type="submit" class="action-btn" style="margin-top: 15px;">Register</button>
                </form>
            </div>

        </div>

    </div>

    <script>
        function switchForm(target) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const leftInfo = document.getElementById('left-info');

            loginForm.classList.add('hidden');
            registerForm.classList.add('hidden');

            if (target === 'register') {
                registerForm.classList.remove('hidden');
                leftInfo.innerHTML = `
                    <h3>Join Us Today!</h3>
                    <p>Create an account to unlock full access to all features and portal tools.</p>
                `;
            } else {
                loginForm.classList.remove('hidden');
                leftInfo.innerHTML = `
                    <h3>Welcome Back!</h3>
                    <p>Access your portal and manage your account securely with our integrated dashboard system.</p>
                    <button class="toggle-btn" onclick="switchForm('register')">Register</button>
                `;
            }
        }

        window.addEventListener('load', function() {
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        });
    </script>

</body>
</html>
